<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Recipe Library</title>
  <style>
    :root {
      --primary: #2e7d32;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
    }
    .recipe-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }
    .recipe-card h2 {
      margin-top: 0;
      color: #1b5e20;
    }
    .meta {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: #666;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .section-title {
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 8px;
      color: #333;
    }
    ul, ol {
      padding-left: 20px;
      margin-top: 5px;
    }
    li {
      margin-bottom: 6px;
    }
    .source-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #1e88e5;
      text-decoration: none;
    }
    .source-link:hover {
      text-decoration: underline;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🍳 Family Recipe Collection</h1>
      <p class="subtitle">Automated recipe library synced from Discord</p>
    </header>

    <div id="loading">Loading recipes...</div>
    <div id="recipes-container"></div>
  </div>

  <script>
    async function loadRecipes() {
      const container = document.getElementById('recipes-container');
      const loading = document.getElementById('loading');

      try {
        // Fetch the recipes.json file generated by Make.com
        const response = await fetch('./Recipes.json?cachebuster=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load recipes file.');
        
        const data = await response.json();
        const recipes = Array.isArray(data) ? data : [data];
        
        loading.style.display = 'none';
        container.innerHTML = '';

        recipes.forEach(recipe => {
          // 1. Build visible UI card
          const card = document.createElement('article');
          card.className = 'recipe-card';
          
          const title = recipe.title || recipe.name || 'Untitled Recipe';
          const prepTime = recipe.prep_time || recipe.prepTime || 'N/A';
          const cookTime = recipe.cook_time || recipe.cookTime || 'N/A';
          const servings = recipe.servings || 'N/A';
          const ingredients = recipe.ingredients || [];
          const instructions = recipe.instructions || recipe.steps || [];
          const videoUrl = recipe.url || recipe.link || '';

          card.innerHTML = `
            <h2>${title}</h2>
            <div class="meta">
              <span>⏱️ Prep: ${prepTime}</span>
              <span>🔥 Cook: ${cookTime}</span>
              <span>🍽️ Servings: ${servings}</span>
            </div>
            
            <div class="section-title">Ingredients</div>
            <ul>
              ${ingredients.map(ing => `<li>${ing}</li>`).join('')}
            </ul>

            <div class="section-title">Instructions</div>
            <ol>
              ${instructions.map(step => `<li>${step}</li>`).join('')}
            </ol>

            ${videoUrl ? `<a href="${videoUrl}" target="_blank" class="source-link">📺 Watch Original Video</a>` : ''}
          `;

          container.appendChild(card);

          // 2. Inject schema.org/Recipe JSON-LD for FamilyWall scraper
          const schemaData = {
            "@context": "https://schema.org/",
            "@type": "Recipe",
            "name": title,
            "recipeIngredient": ingredients,
            "recipeInstructions": instructions.map(step => ({
              "@type": "HowToStep",
              "text": step
            }))
          };

          const script = document.createElement('script');
          script.type = 'application/ld+json';
          script.text = JSON.stringify(schemaData);
          document.head.appendChild(script);
        });

      } catch (err) {
        loading.innerHTML = `<p style="color:red;">Error loading recipes: ${err.message}</p>`;
      }
    }

    loadRecipes();
  </script>

</body>
</html>
